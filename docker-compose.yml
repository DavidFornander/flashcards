version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: flashcards_backend
    ports:
      - "8101:8101"
    environment:
      - NODE_ENV=development
      - PORT=8101
      - DATA_PROVIDER=${DATA_PROVIDER:-firestore}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-key.json
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/secrets:/app/secrets:ro
      - backend_node_modules:/app/node_modules
    networks:
      - flashcards-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8101/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: flashcards_frontend
    ports:
      - "8100:8100"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8101
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/package.json:/app/package.json
      - frontend_node_modules:/app/node_modules
    networks:
      - flashcards-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  flashcards-network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:

